ân 0,3 mm</text><rect x="1100" y="275" width="300" height="80" rx="6" fill="#efe3f6" stroke="#333" stroke-width="1.5"/><text x="1250" y="294" font-size="14" font-weight="bold" text-anchor="middle">Giao diện</text><text x="1250" y="311" font-size="11.5" text-anchor="middle" fill="#222">motor rung, còi 4 kHz (qua AO3400A)</text><text x="1250" y="325" font-size="11.5" text-anchor="middle" fill="#222">nút SOS, nút nguồn</text><text x="1250" y="340" font-size="11.5" text-anchor="middle" fill="#222">LED trạng thái, LED sạc</text><rect x="1100" y="395" width="300" height="66" rx="6" fill="#eeeeee" stroke="#333" stroke-width="1.5"/><text x="1250" y="414" font-size="14" font-weight="bold" text-anchor="middle">Debug và đo</text><text x="1250" y="431" font-size="11.5" text-anchor="middle" fill="#222">UART0, BOOT, RESET</text><text x="1250" y="445" font-size="11.5" text-anchor="middle" fill="#222">test point: nguồn, I2C, SPI, PPG_INT</text><rect x="360" y="455" width="160" height="60" rx="6" fill="#e2f2dc" stroke="#333" stroke-width="1.5"/><text x="440" y="474" font-size="14" font-weight="bold" text-anchor="middle">RTC PCF85063A</text><text x="440" y="491" font-size="11.5" text-anchor="middle" fill="#222">32,768 kHz, INT</text><rect x="560" y="455" width="160" height="60" rx="6" fill="#e2f2dc" stroke="#333" stroke-width="1.5"/><text x="640" y="474" font-size="14" font-weight="bold" text-anchor="middle">IMU BMI270</text><text x="640" y="491" font-size="11.5" text-anchor="middle" fill="#222">6 trục, FIFO, INT1/2</text><rect x="760" y="455" width="240" height="60" rx="6" fill="#eeeeee" stroke="#333" stroke-width="1.5"/><text x="880" y="474" font-size="14" font-weight="bold" text-anchor="middle">FPC 16 chân (J105)</text><text x="880" y="491" font-size="11.5" text-anchor="middle" fill="#222">3V3, VLED, SPI, INT, I2C</text><rect x="760" y="655" width="240" height="60" rx="6" fill="#eeeeee" stroke="#333" stroke-width="1.5"/><text x="880" y="674" font-size="14" font-weight="bold" text-