<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="590" viewBox="0 0 1500 590" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="ahc00000" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c00000"/></marker><marker id="asc00000" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#c00000"/></marker><marker id="ah1f4e9a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f4e9a"/></marker><marker id="as1f4e9a" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1f4e9a"/></marker></defs><rect width="1500" height="590" fill="#ffffff"/><text x="750" y="28" font-size="20" font-weight="bold" text-anchor="middle">Luồng dữ liệu: cảm biến → xử lý trên đồng hồ → web</text><rect x="30" y="80" width="190" height="66" rx="6" fill="#e2f2dc" stroke="#333" stroke-width="1.5"/><text x="125" y="99" font-size="14" font-weight="bold" text-anchor="middle">PPG (MAX86141)</text><text x="125" y="116" font-size="11.5" text-anchor="middle" fill="#222">25 mẫu/s; burst 100 mẫu/s</text><text x="125" y="130" font-size="11.5" text-anchor="middle" fill="#222">ngắt theo watermark FIFO</text><rect x="30" y="230" width="190" height="66" rx="6" fill="#e2f2dc" stroke="#333" stroke-width="1.5"/><text x="125" y="249" font-size="14" font-weight="bold" text-anchor="middle">IMU (BMI270)</text><text x="125" y="266" font-size="11.5" text-anchor="middle" fill="#222">50 Hz, FIFO</text><text x="125" y="280" font-size="11.5" text-anchor="middle" fill="#222">đếm bước trong chip</text><rect x="30" y="400" width="190" height="52" rx="6" fill="#e2f2dc" stroke="#333" stroke-width="1.5"/><text x="125" y="419" font-size="14" font-weight="bold" text-anchor="middle">Nhiệt độ (MAX30208)</text><text x="125" y="436" font-size="11.5" text-anchor="middle" fill="#222">1 lần/phút, xu hướng</text><rect x="290" y="70" width="280" height="130" rx="6" fill="#dbe8f7" stroke="#333" stroke-width="1.5"/><text x="430" y="89" font-size="14" font-weight="bold" text-anchor="middle">Xử lý tín hiệu</text><text x="430" y="106" font-size="11.5" text-anchor="middle" fill="#222">task ưu tiên cao trên core 1</text><text x="430" y="120" font-size="11.5" text-anchor="middle" fill="#222">lọc, khử nhiễu bằng gia tốc</text><text x="430" y="135" font-size="11.5" text-anchor="middle" fill="#222">nhịp tim, IBI/PRV</text><text x="430" y="149" font-size="11.5" text-anchor="middle" fill="#222">cờ chất lượng, phát hiện tháo tay</text><text x="430" y="164" font-size="11.5" text-anchor="middle" fill="#222">SpO2 thử nghiệm, không cảnh báo</text><text x="430" y="178" font-size="11.5" text-anchor="middle" fill="#222">căn đồng hồ PPG với BMI</text><rect x="290" y="245" width="280" height="125" rx="6" fill="#ffd9d9" stroke="#333" stroke-width="1.5"/><text x="430" y="264" font-size="14" font-weight="bold" text-anchor="middle">Edge AI (TFLite Micro int8)</text><text x="430" y="281" font-size="11.5" text-anchor="middle" fill="#222">chạy trong SRAM nội</text><text x="430" y="295" font-size="11.5" text-anchor="middle" fill="#222">té ngã: va chạm → CNN</text><text x="430" y="310" font-size="11.5" text-anchor="middle" fill="#222">hoạt động: ít lớp</text><text x="430" y="324" font-size="11.5" text-anchor="middle" fill="#222">mẫu mạch không đều (thử nghiệm)</text><text x="430" y="339" font-size="11.5" text-anchor="middle" fill="#222">ngủ/thức, thời lượng</text><rect x="640" y="70" width="250" height="125" rx="6" fill="#efe3f6" stroke="#333" stroke-width="1.5"/><text x="765" y="89" font-size="14" font-weight="bold" text-anchor="middle">Quyết định cảnh báo</text><text x="765" y="106" font-size="11.5" text-anchor="middle" fill="#222">té ngã: nằm yên 5-10 s, hủy 30-60 s</text><text x="765" y="120" font-size="11.5" text-anchor="middle" fill="#222">SOS: gửi ngay</text><text x="765" y="135" font-size="11.5" text-anchor="middle" fill="#222">mạch không đều: kéo dài ≥ 30 phút,</text><text x="765" y="149" font-size="11.5" text-anchor="middle" fill="#222">thông báo không khẩn</text><text x="765" y="164" font-size="11.5" text-anchor="middle" fill="#222">pin yếu: giữ dự trữ cho SOS</text><rect x="640" y="290" width="250" height="80" rx="6" fill="#dbe8f7" stroke="#333" stroke-width="1.5"/><text x="765" y="309" font-size="14" font-weight="bold" text-anchor="middle">Log vòng trên flash</text><text x="765" y="326" font-size="11.5" text-anchor="middle" fill="#222">dữ liệu tổng hợp 1 phút</text><text x="765" y="340" font-size="11.5" text-anchor="middle" fill="#222">hàng đợi sự kiện chưa có ACK</text><rect x="960" y="70" width="230" height="96" rx="6" fill="#fff7c2" stroke="#333" stroke-width="1.5"/><text x="1075" y="89" font-size="14" font-weight="bold" text-anchor="middle">WiFi HTTPS</text><text x="1075" y="106" font-size="11.5" text-anchor="middle" fill="#222">lô 15 phút, có backoff</text><text x="1075" y="120" font-size="11.5" text-anchor="middle" fill="#222">sự kiện: event ID + ACK, retry</text><text x="1075" y="135" font-size="11.5" text-anchor="middle" fill="#222">OTA có chữ ký, rollback</text><rect x="960" y="200" width="230" height="66" rx="6" fill="#efe3f6" stroke="#333" stroke-width="1.5"/><text x="1075" y="219" font-size="14" font-weight="bold" text-anchor="middle">Báo tại chỗ</text><text x="1075" y="236" font-size="11.5" text-anchor="middle" fill="#222">rung, còi, màn hình</text><text x="1075" y="250" font-size="11.5" text-anchor="middle" fill="#222">luôn chạy, kể cả khi mất mạng</text><rect x="960" y="400" width="230" height="66" rx="6" fill="#fff7c2" stroke="#333" stroke-width="1.5"/><text x="1075" y="419" font-size="14" font-weight="bold" text-anchor="middle">BLE (điện thoại)</text><text x="1075" y="436" font-size="11.5" text-anchor="middle" fill="#222">cấu hình WiFi (provisioning)</text><text x="1075" y="450" font-size="11.5" text-anchor="middle" fill="#222">không phải đường gửi khẩn</text><rect x="1260" y="70" width="215" height="180" rx="6" fill="#fff7c2" stroke="#333" stroke-width="1.5"/><text x="1367" y="89" font-size="14" font-weight="bold" text-anchor="middle">Server + web tự viết</text><text x="1367" y="106" font-size="11.5" text-anchor="middle" fill="#222">đăng nhập, phân quyền</text><text x="1367" y="120" font-size="11.5" text-anchor="middle" fill="#222">hash token thiết bị</text><text x="1367" y="135" font-size="11.5" text-anchor="middle" fill="#222">mã hóa khi lưu, retention</text><text x="1367" y="149" font-size="11.5" text-anchor="middle" fill="#222">consent, xóa dữ liệu</text><text x="1367" y="164" font-size="11.5" text-anchor="middle" fill="#222">đẩy cảnh báo cho người thân</text><text x="1367" y="178" font-size="11.5" text-anchor="middle" fill="#222">dashboard, phát hành OTA</text><path d="M 220.0 113.0 L 290.0 113.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="255.0" y="108.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">SPI</text><path d="M 220.0 250.0 L 255.0 250.0 L 255.0 165.0 L 290.0 165.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="227.0" y="205.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">gia tốc</text><path d="M 220.0 280.0 L 290.0 280.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="255.0" y="275.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">I2C</text><path d="M 220.0 426.0 L 600.0 426.0 L 600.0 345.0 L 640.0 345.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="400.0" y="420.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">I2C</text><path d="M 430.0 195.0 L 430.0 245.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="475.0" y="224.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">đặc trưng</text><path d="M 570.0 110.0 L 640.0 110.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="605.0" y="105.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">HR</text><path d="M 570.0 270.0 L 605.0 270.0 L 605.0 170.0 L 640.0 170.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="605.0" y="225.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">nhãn</text><path d="M 570.0 320.0 L 640.0 320.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="605.0" y="315.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">tổng hợp</text><path d="M 890.0 100.0 L 960.0 100.0" fill="none" stroke="#c00000" stroke-width="1.8" marker-end="url(#ahc00000)"/><text x="925.0" y="95.0" font-size="11" text-anchor="middle" fill="#c00000" stroke="#fff" stroke-width="3" paint-order="stroke">khẩn</text><path d="M 890.0 165.0 L 925.0 165.0 L 925.0 233.0 L 960.0 233.0" fill="none" stroke="#c00000" stroke-width="1.8" marker-end="url(#ahc00000)"/><path d="M 765.0 195.0 L 765.0 290.0" fill="none" stroke="#c00000" stroke-width="1.8" marker-end="url(#ahc00000)"/><text x="805.0" y="248.0" font-size="11" text-anchor="middle" fill="#c00000" stroke="#fff" stroke-width="3" paint-order="stroke">hàng đợi</text><path d="M 890.0 345.0 L 1225.0 345.0 L 1225.0 140.0 L 1190.0 140.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="1040.0" y="340.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">lô 15 phút</text><path d="M 1190.0 100.0 L 1260.0 100.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)" marker-start="url(#as1f4e9a)"/><text x="1225.0" y="95.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">TLS</text><text x="30" y="505" font-size="13" text-anchor="start" fill="#333">Ngoài vùng WiFi: cảnh báo chỉ báo tại chỗ và nằm trong hàng đợi đến khi có mạng. Muốn báo từ xa khi không có WiFi cần app native hoặc LTE-M.</text><text x="30" y="522" font-size="13" text-anchor="start" fill="#333">Nguyên mẫu nghiên cứu, không phải thiết bị y tế: SpO2 và mẫu mạch không đều là thử nghiệm, không dùng để chẩn đoán.</text><text x="30" y="539" font-size="13" text-anchor="start" fill="#333">Dữ liệu thô không rời thiết bị trong vận hành thường; chế độ ghi riêng qua USB/BLE để tự thu. HR, SpO2 vẫn là dữ liệu sức khỏe: cần consent và TLS.</text><text x="30" y="556" font-size="13" text-anchor="start" fill="#333">Bỏ khỏi kế hoạch: phân giai đoạn ngủ, stress, gửi vị trí.</text></svg>