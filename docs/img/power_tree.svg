<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="545" viewBox="0 0 1400 545" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="ahc55a11" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c55a11"/></marker><marker id="asc55a11" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#c55a11"/></marker></defs><rect width="1400" height="545" fill="#ffffff"/><text x="700" y="28" font-size="20" font-weight="bold" text-anchor="middle">Cây nguồn và điểm đo dòng (shunt + test point)</text><rect x="30" y="80" width="170" height="56" rx="6" fill="#eeeeee" stroke="#333" stroke-width="1.5"/><text x="115" y="99" font-size="14" font-weight="bold" text-anchor="middle">USB VBUS 5 V</text><text x="115" y="116" font-size="11.5" text-anchor="middle" fill="#222">TP101</text><rect x="30" y="225" width="170" height="70" rx="6" fill="#fde9d0" stroke="#333" stroke-width="1.5"/><text x="115" y="244" font-size="14" font-weight="bold" text-anchor="middle">LiPo 1S 400 mAh</text><text x="115" y="261" font-size="11.5" text-anchor="middle" fill="#222">R111 50 mΩ</text><text x="115" y="275" font-size="11.5" text-anchor="middle" fill="#222">TP102 ↔ TP103</text><rect x="270" y="70" width="250" height="240" rx="6" fill="#fde9d0" stroke="#333" stroke-width="1.5"/><text x="395" y="89" font-size="14" font-weight="bold" text-anchor="middle">AXP2101</text><text x="395" y="106" font-size="11.5" text-anchor="middle" fill="#222">VBUS → VMID; R126 không lắp</text><text x="395" y="120" font-size="11.5" text-anchor="middle" fill="#222">buck: VMID → chân SW</text><text x="395" y="135" font-size="11.5" text-anchor="middle" fill="#222">BATFET: BAT ↔ VSYS</text><text x="395" y="149" font-size="11.5" text-anchor="middle" fill="#222">DCDC1 3 MHz → 3V3_PMIC</text><text x="395" y="164" font-size="11.5" text-anchor="middle" fill="#222">VRTC, VREF</text><text x="395" y="178" font-size="11.5" text-anchor="middle" fill="#222">NTC trên bo → ngắt sạc</text><text x="395" y="193" font-size="11.5" text-anchor="middle" fill="#222">DCDC2-4, LDO: không dùng</text><text x="395" y="207" font-size="11.5" text-anchor="middle" fill="#222"></text><text x="395" y="222" font-size="11.5" text-anchor="middle" fill="#222">Mặc định do OTP: phải đọc</text><text x="395" y="236" font-size="11.5" text-anchor="middle" fill="#222">thanh ghi trên bo thật</text><rect x="580" y="215" width="150" height="66" rx="6" fill="#fde9d0" stroke="#333" stroke-width="1.5"/><text x="655" y="234" font-size="14" font-weight="bold" text-anchor="middle">L102 1 µH</text><text x="655" y="251" font-size="11.5" text-anchor="middle" fill="#222">R105 0 Ω 0805</text><text x="655" y="265" font-size="11.5" text-anchor="middle" fill="#222">mang dòng USB vào</text><rect x="790" y="70" width="260" height="70" rx="6" fill="#fde9d0" stroke="#333" stroke-width="1.5"/><text x="920" y="89" font-size="14" font-weight="bold" text-anchor="middle">+3V3 (R112 0,1 Ω)</text><text x="920" y="106" font-size="11.5" text-anchor="middle" fill="#222">TP104 ↔ TP105</text><text x="920" y="120" font-size="11.5" text-anchor="middle" fill="#222">ESP32, flash, màn hình, IMU, RTC</text><rect x="790" y="215" width="260" height="66" rx="6" fill="#fde9d0" stroke="#333" stroke-width="1.5"/><text x="920" y="234" font-size="14" font-weight="bold" text-anchor="middle">VSYS (theo pin; đo khi có USB)</text><text x="920" y="251" font-size="11.5" text-anchor="middle" fill="#222">motor, còi qua MOSFET</text><text x="920" y="265" font-size="11.5" text-anchor="middle" fill="#222">LED sạc, boost</text><rect x="790" y="345" width="260" height="56" rx="6" fill="#fde9d0" stroke="#333" stroke-width="1.5"/><text x="920" y="364" font-size="14" font-weight="bold" text-anchor="middle">TPS61240 → VLED_5V</text><text x="920" y="381" font-size="11.5" text-anchor="middle" fill="#222">R114 0,1 Ω: TP108 ↔ TP109</text><rect x="1110" y="70" width="270" height="70" rx="6" fill="#fde9d0" stroke="#333" stroke-width="1.5"/><text x="1245" y="89" font-size="14" font-weight="bold" text-anchor="middle">LP5907 1,8 V (bo cảm biến)</text><text x="1245" y="106" font-size="11.5" text-anchor="middle" fill="#222">R201 0,1 Ω: TP201 ↔ TP202</text><text x="1245" y="120" font-size="11.5" text-anchor="middle" fill="#222">MAX86141 VDD, TXS0108E VCCA, OE</text><rect x="1110" y="190" width="270" height="56" rx="6" fill="#e2f2dc" stroke="#333" stroke-width="1.5"/><text x="1245" y="209" font-size="14" font-weight="bold" text-anchor="middle">+3V3 bo cảm biến</text><text x="1245" y="226" font-size="11.5" text-anchor="middle" fill="#222">MAX30208, TXS0108E VCCB</text><rect x="1110" y="345" width="270" height="56" rx="6" fill="#e2f2dc" stroke="#333" stroke-width="1.5"/><text x="1245" y="364" font-size="14" font-weight="bold" text-anchor="middle">VLED (bo cảm biến)</text><text x="1245" y="381" font-size="11.5" text-anchor="middle" fill="#222">anode SFH 7016 → MAX86141 LEDx_DRV</text><path d="M 200.0 108.0 L 270.0 108.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)"/><path d="M 200.0 260.0 L 270.0 260.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)" marker-start="url(#asc55a11)"/><path d="M 520.0 105.0 L 790.0 105.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)"/><text x="650.0" y="99.0" font-size="11" text-anchor="middle" fill="#c55a11" stroke="#fff" stroke-width="3" paint-order="stroke">DCDC1 (L101, FB1)</text><path d="M 520.0 248.0 L 580.0 248.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)"/><text x="550.0" y="243.0" font-size="11" text-anchor="middle" fill="#c55a11" stroke="#fff" stroke-width="3" paint-order="stroke">SW</text><path d="M 730.0 248.0 L 790.0 248.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)"/><path d="M 920.0 281.0 L 920.0 345.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)"/><text x="1000.0" y="318.0" font-size="11" text-anchor="middle" fill="#c55a11" stroke="#fff" stroke-width="3" paint-order="stroke">EN = GPIO3, R113 1 MΩ</text><path d="M 1050.0 105.0 L 1110.0 105.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)"/><text x="1080.0" y="100.0" font-size="11" text-anchor="middle" fill="#c55a11" stroke="#fff" stroke-width="3" paint-order="stroke">FPC</text><path d="M 1080.0 105.0 L 1080.0 218.0 L 1110.0 218.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)"/><path d="M 1050.0 373.0 L 1110.0 373.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)"/><text x="1080.0" y="368.0" font-size="11" text-anchor="middle" fill="#c55a11" stroke="#fff" stroke-width="3" paint-order="stroke">FPC</text><text x="30" y="450" font-size="13" text-anchor="start" fill="#333">Đo dòng: đo mV giữa hai test point của shunt, I = V / R_shunt (R111 = 0,05 Ω; R112, R114, R201 = 0,1 Ω). Ví dụ 10 mV trên R112 = 100 mA.</text><text x="30" y="467" font-size="13" text-anchor="start" fill="#333">Trình tự: AXP2101 khởi động DCDC1 → PWROK nhả CHIP_PU → ESP32 chạy → ESP32 bật boost khi đo PPG.</text><text x="30" y="484" font-size="13" text-anchor="start" fill="#333">Bảo vệ pin: firmware đặt ngưỡng VOFF (REG24) = 3,3 V và cắt WiFi, độ sáng, rung theo VBAT; UVP của DCDC1 tắt PMIC ở 2,805 V.</text><text x="30" y="501" font-size="13" text-anchor="start" fill="#333">VCCA (1,8 V) ≤ VCCB (3,3 V) của TXS0108E luôn đúng vì 1,8 V lấy từ 3,3 V; OE nối thẳng VCCA.</text><text x="30" y="518" font-size="13" text-anchor="start" fill="#333">R112 nằm sau FB1 nên không được bù: ở 0,6 A, +3V3 giảm 60 mV.</text></svg>