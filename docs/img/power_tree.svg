<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="ahc55a11" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c55a11"/></marker><marker id="asc55a11" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#c55a11"/></marker></defs><rect width="1300" height="660" fill="#ffffff"/><text x="650" y="28" font-size="20" font-weight="bold" text-anchor="middle">Cây nguồn và điểm đo dòng (shunt + test point)</text><rect x="30" y="80" width="170" height="70" rx="6" fill="#eeeeee" stroke="#333" stroke-width="1.5"/><text x="115" y="99" font-size="14" font-weight="bold" text-anchor="middle">USB VBUS 5 V</text><text x="115" y="116" font-size="11.5" text-anchor="middle" fill="#222">TP101</text><rect x="280" y="70" width="230" height="230" rx="6" fill="#fde9d0" stroke="#333" stroke-width="1.5"/><text x="395" y="89" font-size="14" font-weight="bold" text-anchor="middle">AXP2101</text><text x="395" y="106" font-size="11.5" text-anchor="middle" fill="#222">VBUS → VMID → sạc tuyến tính</text><text x="395" y="120" font-size="11.5" text-anchor="middle" fill="#222">BATFET: BAT ↔ VSYS</text><text x="395" y="135" font-size="11.5" text-anchor="middle" fill="#222">DCDC1 3 MHz → 3V3_PMIC</text><text x="395" y="149" font-size="11.5" text-anchor="middle" fill="#222">VRTC, VREF</text><text x="395" y="164" font-size="11.5" text-anchor="middle" fill="#222">NTC → ngắt sạc khi nóng</text><text x="395" y="178" font-size="11.5" text-anchor="middle" fill="#222">DCDC2-4, LDO khác: không dùng</text><rect x="30" y="220" width="170" height="80" rx="6" fill="#fde9d0" stroke="#333" stroke-width="1.5"/><text x="115" y="239" font-size="14" font-weight="bold" text-anchor="middle">LiPo 1S 400 mAh</text><text x="115" y="256" font-size="11.5" text-anchor="middle" fill="#222">R111 50 mΩ</text><text x="115" y="270" font-size="11.5" text-anchor="middle" fill="#222">TP102 ↔ TP103</text><rect x="620" y="70" width="230" height="80" rx="6" fill="#fde9d0" stroke="#333" stroke-width="1.5"/><text x="735" y="89" font-size="14" font-weight="bold" text-anchor="middle">+3V3 (R112 0.1 Ω)</text><text x="735" y="106" font-size="11.5" text-anchor="middle" fill="#222">TP104 ↔ TP105</text><text x="735" y="120" font-size="11.5" text-anchor="middle" fill="#222">ESP32, flash, màn hình, IMU, RTC</text><rect x="620" y="200" width="230" height="80" rx="6" fill="#fde9d0" stroke="#333" stroke-width="1.5"/><text x="735" y="219" font-size="14" font-weight="bold" text-anchor="middle">VSYS 3.4-4.4 V</text><text x="735" y="236" font-size="11.5" text-anchor="middle" fill="#222">motor, còi (qua MOSFET)</text><text x="735" y="250" font-size="11.5" text-anchor="middle" fill="#222">LED sạc</text><rect x="620" y="330" width="230" height="80" rx="6" fill="#fde9d0" stroke="#333" stroke-width="1.5"/><text x="735" y="349" font-size="14" font-weight="bold" text-anchor="middle">TPS61240 → VLED_5V</text><text x="735" y="366" font-size="11.5" text-anchor="middle" fill="#222">R114 0.1 Ω: TP108 ↔ TP109</text><rect x="940" y="70" width="300" height="80" rx="6" fill="#fde9d0" stroke="#333" stroke-width="1.5"/><text x="1090" y="89" font-size="14" font-weight="bold" text-anchor="middle">LP5907 1.8 V (bo cảm biến)</text><text x="1090" y="106" font-size="11.5" text-anchor="middle" fill="#222">R201 0.1 Ω: TP201 ↔ TP202</text><text x="1090" y="120" font-size="11.5" text-anchor="middle" fill="#222">MAX86141 VDD, TXS0108E VCCA</text><rect x="940" y="200" width="300" height="80" rx="6" fill="#e2f2dc" stroke="#333" stroke-width="1.5"/><text x="1090" y="219" font-size="14" font-weight="bold" text-anchor="middle">+3V3 bo cảm biến</text><text x="1090" y="236" font-size="11.5" text-anchor="middle" fill="#222">MAX30208, TXS0108E VCCB</text><rect x="940" y="330" width="300" height="80" rx="6" fill="#e2f2dc" stroke="#333" stroke-width="1.5"/><text x="1090" y="349" font-size="14" font-weight="bold" text-anchor="middle">VLED (bo cảm biến)</text><text x="1090" y="366" font-size="11.5" text-anchor="middle" fill="#222">anode SFH 7013 → MAX86141 LEDx_DRV</text><path d="M 200.0 115.0 L 280.0 97.6" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)"/><path d="M 200.0 260.0 L 280.0 254.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)" marker-start="url(#asc55a11)"/><path d="M 510.0 97.6 L 620.0 110.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)"/><text x="565.0" y="98.8" font-size="11" text-anchor="middle" fill="#c55a11" stroke="#fff" stroke-width="3" paint-order="stroke">DCDC1</text><path d="M 510.0 208.0 L 620.0 240.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)"/><text x="565.0" y="219.0" font-size="11" text-anchor="middle" fill="#c55a11" stroke="#fff" stroke-width="3" paint-order="stroke">VSYS</text><path d="M 560.0 240.0 L 560.0 370.0 L 620.0 370.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)"/><text x="600.0" y="300.0" font-size="11" text-anchor="middle" fill="#c55a11" stroke="#fff" stroke-width="3" paint-order="stroke">EN = GPIO3</text><path d="M 850.0 110.0 L 940.0 110.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)"/><text x="895.0" y="105.0" font-size="11" text-anchor="middle" fill="#c55a11" stroke="#fff" stroke-width="3" paint-order="stroke">FPC</text><path d="M 880.0 110.0 L 880.0 240.0 L 940.0 240.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)"/><path d="M 850.0 370.0 L 940.0 370.0" fill="none" stroke="#c55a11" stroke-width="1.8" marker-end="url(#ahc55a11)"/><text x="895.0" y="365.0" font-size="11" text-anchor="middle" fill="#c55a11" stroke="#fff" stroke-width="3" paint-order="stroke">FPC</text><text x="30" y="470" font-size="13" text-anchor="start" fill="#333">Đo dòng: đặt đồng hồ đo mV giữa hai test point của shunt, I = V / R_shunt (R111 = 0.05 Ω, R112/R114/R201 = 0.1 Ω).</text><text x="30" y="487" font-size="13" text-anchor="start" fill="#333">Ví dụ 10 mV trên R112 = 100 mA trên đường 3V3. Đo ngủ sâu (µA) thì tháo shunt, nối đồng hồ µA nối tiếp hai pad.</text><text x="30" y="504" font-size="13" text-anchor="start" fill="#333">Trình tự: AXP2101 khởi động DCDC1 → PWROK nhả CHIP_PU → ESP32 chạy → ESP32 bật boost VLED khi cần đo PPG.</text><text x="30" y="521" font-size="13" text-anchor="start" fill="#333">VCCA (1.8 V) ≤ VCCB (3.3 V) của TXS0108E luôn đúng vì 1.8 V lấy từ 3.3 V; OE chỉ lên sau RC ~10 ms.</text></svg>