<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="ahc00000" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c00000"/></marker><marker id="asc00000" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#c00000"/></marker><marker id="ah1f4e9a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f4e9a"/></marker><marker id="as1f4e9a" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1f4e9a"/></marker></defs><rect width="1500" height="560" fill="#ffffff"/><text x="750" y="28" font-size="20" font-weight="bold" text-anchor="middle">Luồng dữ liệu: cảm biến → edge AI trên đồng hồ → web</text><rect x="30" y="80" width="200" height="80" rx="6" fill="#e2f2dc" stroke="#333" stroke-width="1.5"/><text x="130" y="99" font-size="14" font-weight="bold" text-anchor="middle">PPG (MAX86141)</text><text x="130" y="116" font-size="11.5" text-anchor="middle" fill="#222">25-100 mẫu/s, FIFO</text><rect x="30" y="200" width="200" height="80" rx="6" fill="#e2f2dc" stroke="#333" stroke-width="1.5"/><text x="130" y="219" font-size="14" font-weight="bold" text-anchor="middle">IMU (BMI270)</text><text x="130" y="236" font-size="11.5" text-anchor="middle" fill="#222">50 Hz, FIFO, INT</text><rect x="30" y="320" width="200" height="80" rx="6" fill="#e2f2dc" stroke="#333" stroke-width="1.5"/><text x="130" y="339" font-size="14" font-weight="bold" text-anchor="middle">Nhiệt độ da</text><text x="130" y="356" font-size="11.5" text-anchor="middle" fill="#222">1 lần/phút</text><rect x="310" y="80" width="250" height="120" rx="6" fill="#dbe8f7" stroke="#333" stroke-width="1.5"/><text x="435" y="99" font-size="14" font-weight="bold" text-anchor="middle">Tiền xử lý (FreeRTOS task)</text><text x="435" y="116" font-size="11.5" text-anchor="middle" fill="#222">lọc thông dải, phát hiện đỉnh</text><text x="435" y="130" font-size="11.5" text-anchor="middle" fill="#222">HR, SpO2 (tỉ số R), IBI/HRV</text><text x="435" y="145" font-size="11.5" text-anchor="middle" fill="#222">đặc trưng cửa sổ 2-30 s</text><rect x="310" y="240" width="250" height="160" rx="6" fill="#ffd9d9" stroke="#333" stroke-width="1.5"/><text x="435" y="259" font-size="14" font-weight="bold" text-anchor="middle">Edge AI (TFLite Micro int8)</text><text x="435" y="276" font-size="11.5" text-anchor="middle" fill="#222">1D-CNN té ngã + hoạt động</text><text x="435" y="290" font-size="11.5" text-anchor="middle" fill="#222">phân loại nhịp (IBI) → AF?</text><text x="435" y="305" font-size="11.5" text-anchor="middle" fill="#222">giấc ngủ / stress (HRV+motion)</text><text x="435" y="319" font-size="11.5" text-anchor="middle" fill="#222">train trên Google Colab</text><text x="435" y="334" font-size="11.5" text-anchor="middle" fill="#222">(dataset công khai + tự thu)</text><rect x="640" y="80" width="230" height="120" rx="6" fill="#efe3f6" stroke="#333" stroke-width="1.5"/><text x="755" y="99" font-size="14" font-weight="bold" text-anchor="middle">Bộ quyết định sự kiện</text><text x="755" y="116" font-size="11.5" text-anchor="middle" fill="#222">té ngã / nhịp bất thường / SOS</text><text x="755" y="130" font-size="11.5" text-anchor="middle" fill="#222">→ rung + còi + màn hình</text><text x="755" y="145" font-size="11.5" text-anchor="middle" fill="#222">→ gửi NGAY</text><rect x="640" y="260" width="230" height="120" rx="6" fill="#dbe8f7" stroke="#333" stroke-width="1.5"/><text x="755" y="279" font-size="14" font-weight="bold" text-anchor="middle">Bộ đệm flash 16 MB</text><text x="755" y="296" font-size="11.5" text-anchor="middle" fill="#222">dữ liệu tổng hợp 1 phút</text><text x="755" y="310" font-size="11.5" text-anchor="middle" fill="#222">giữ lại khi mất mạng</text><rect x="950" y="80" width="230" height="100" rx="6" fill="#fff7c2" stroke="#333" stroke-width="1.5"/><text x="1065" y="99" font-size="14" font-weight="bold" text-anchor="middle">WiFi HTTPS</text><text x="1065" y="116" font-size="11.5" text-anchor="middle" fill="#222">lô 15 phút: POST /api/batch</text><text x="1065" y="130" font-size="11.5" text-anchor="middle" fill="#222">sự kiện: POST /api/event</text><rect x="950" y="240" width="230" height="100" rx="6" fill="#fff7c2" stroke="#333" stroke-width="1.5"/><text x="1065" y="259" font-size="14" font-weight="bold" text-anchor="middle">BLE → điện thoại</text><text x="1065" y="276" font-size="11.5" text-anchor="middle" fill="#222">dự phòng khi không có WiFi</text><text x="1065" y="290" font-size="11.5" text-anchor="middle" fill="#222">(Web Bluetooth / app)</text><rect x="1260" y="80" width="210" height="260" rx="6" fill="#fff7c2" stroke="#333" stroke-width="1.5"/><text x="1365" y="99" font-size="14" font-weight="bold" text-anchor="middle">Server + web tự viết</text><text x="1365" y="116" font-size="11.5" text-anchor="middle" fill="#222">REST API (HTTPS)</text><text x="1365" y="130" font-size="11.5" text-anchor="middle" fill="#222">cơ sở dữ liệu chuỗi thời gian</text><text x="1365" y="145" font-size="11.5" text-anchor="middle" fill="#222">dashboard: biểu đồ HR,</text><text x="1365" y="159" font-size="11.5" text-anchor="middle" fill="#222">SpO2, bước, nhiệt độ, ngủ</text><text x="1365" y="174" font-size="11.5" text-anchor="middle" fill="#222">cảnh báo cho người thân</text><text x="1365" y="188" font-size="11.5" text-anchor="middle" fill="#222">OTA firmware / model</text><path d="M 230.0 120.0 L 310.0 140.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="270.0" y="125.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">SPI</text><path d="M 230.0 360.0 L 310.0 188.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="270.0" y="269.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">I2C</text><path d="M 230.0 240.0 L 310.0 272.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="270.0" y="251.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">I2C FIFO</text><path d="M 435.0 200.0 L 435.0 240.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="480.0" y="225.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">đặc trưng</text><path d="M 560.0 272.0 L 640.0 164.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="600.0" y="213.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">nhãn + độ tin cậy</text><path d="M 560.0 116.0 L 640.0 116.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="600.0" y="111.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">HR, SpO2</text><path d="M 560.0 352.0 L 640.0 320.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="600.0" y="331.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">tổng hợp</text><path d="M 870.0 140.0 L 950.0 130.0" fill="none" stroke="#c00000" stroke-width="1.8" marker-end="url(#ahc00000)"/><text x="910.0" y="130.0" font-size="11" text-anchor="middle" fill="#c00000" stroke="#fff" stroke-width="3" paint-order="stroke">khẩn</text><path d="M 755.0 380.0 L 755.0 420.0 L 1210.0 420.0 L 1210.0 205.0 L 1150.0 205.0 L 1150.1 180.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="980.0" y="414.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">lô 15 phút</text><path d="M 824.0 200.0 L 824.0 230.0 L 900.0 230.0 L 900.0 280.0 L 950.0 280.0" fill="none" stroke="#c00000" stroke-width="1.8" marker-end="url(#ahc00000)"/><text x="880.0" y="226.0" font-size="11" text-anchor="middle" fill="#c00000" stroke="#fff" stroke-width="3" paint-order="stroke">không WiFi</text><path d="M 1180.0 130.0 L 1260.0 132.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="1220.0" y="126.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">TLS</text><path d="M 1180.0 290.0 L 1260.0 275.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="1220.0" y="272.0" font-size="11" text-anchor="middle" fill="#1f4e9a" stroke="#fff" stroke-width="3" paint-order="stroke">điện thoại chuyển tiếp</text><text x="30" y="450" font-size="13" text-anchor="start" fill="#333">Cảnh báo AF/nhịp bất thường chỉ là SÀNG LỌC (screening), không phải chẩn đoán y khoa - hiển thị khuyến cáo đi khám.</text><text x="30" y="467" font-size="13" text-anchor="start" fill="#333">Mọi model chạy trên đồng hồ: dữ liệu thô không cần rời thiết bị, chỉ gửi kết quả + tổng hợp → tiết kiệm pin và riêng tư.</text></svg>