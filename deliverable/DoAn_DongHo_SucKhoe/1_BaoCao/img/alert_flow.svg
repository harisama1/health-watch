"none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><path d="M 980.0 375.0 L 1030.0 375.0" fill="none" stroke="#1f4e9a" stroke-width="1.8" marker-end="url(#ah1f4e9a)"/><text x="30" y="450" font-size="12.5" text-anchor="start" fill="#333">Lý do: 43.200 cửa sổ/ngày ở bước 2 s; cảnh báo theo từng cửa sổ thì độ đặc hiệu 99,9 % vẫn cho 43 lần báo giả/ngày. Tham số trên là điểm khởi đầu, phải đánh giá bằng báo giả/ngày khi đeo nhiều ngày.</text><text x="30" y="466" font-size="12.5" text-anchor="start" fill="#333">Mất mạng: sự kiện nằm trong hàng đợi flash, thiết bị vẫn báo tại chỗ, gửi lại khi có WiFi.</text></svg>